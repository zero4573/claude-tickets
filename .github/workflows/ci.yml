# Tests on Linux, macOS and Windows, and the cross-built binaries.
# Manual only for now (Actions > CI > Run workflow): ct isn't released
# yet. To run it on every change, add under `on:`
#   push:
#     branches: [main]
#   pull_request:
name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Format
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The CLI tests (sh stubs, real git) skip themselves on Windows
      - name: Test
        run: go test ./...

  cross:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe, for the version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build linux/darwin/windows x amd64/arm64
        run: make cross
      - uses: actions/upload-artifact@v4
        with:
          name: ct-binaries
          path: dist/
